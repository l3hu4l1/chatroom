syntax = "proto3";

package protocol.v1;

option go_package = "github.com/l3hu4l1/chatroom/protocol/v1;protocolv1";

message WireMessage {
  uint32 version = 1;

  oneof body {
    ClientHello client_hello = 2;
    ClientMessage client_message = 3;
    ServerWelcome server_welcome = 4;
    ServerEvent server_event = 5;
    Ping ping = 6;
    Pong pong = 7;
    ProtocolError error = 8;
  }
}

message ClientHello {
  string nickname = 1;
}

message ClientMessage {
  string text = 1;
  string room = 2;
}

message ServerWelcome {
  uint64 connection_id = 1;
  string nickname = 2;
}

message ServerEvent {
  string sender = 1;
  string text = 2;
  uint64 sent_at_unix_ms = 3;
}

message Ping {
  uint64 sent_at_unix_ms = 1;
}

message Pong {
  uint64 sent_at_unix_ms = 1;
}

message ProtocolError {
  uint32 code = 1;
  string message = 2;
}